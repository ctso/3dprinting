[gcode_macro PRINT_RESET]
gcode:
    M117
    TURN_OFF_HEATERS
    M107 # Turn off cooling
    SET_FAN_SPEED FAN=nevermore SPEED=0
    SET_FAN_SPEED FAN=bed SPEED=0
    HOUR_COUNTER_OFF
    G90  # Absolute Positioning
    M83  # Relative Extrusion
    G92 E0 # Zero Extruder
    M220 S100 # Reset Speed
    M221 S100 # Reset Flow

[gcode_macro PRINT_START]
gcode:
    {% set CHAMBER_TARGET = params.CHAMBER_TARGET|default(0)|int %}
    {% set INITIAL_EXTRUDER = params.INITIAL_EXTRUDER|default(0)|int %}
    {% set PREHEAT_TEMP = params.PREHEAT_TEMP|default(180)|int %}
    PRINT_RESET
    BED_MESH_CLEAR
    CASELIGHTS_ON
    M117 Starting
    M107                                              ; Turn off fan
    CLEAR_PAUSE                                       ; Reset pause state

    RESPOND MSG="Preheating Bed"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.BED}
    TEMPERATURE_WAIT SENSOR="heater_bed" MINIMUM={params.BED}

    RESPOND MSG="Turning on bed fans"
    SET_FAN_SPEED FAN=nevermore SPEED=1.0
    SET_FAN_SPEED FAN=bed SPEED=0.8

    RESPOND MSG="Waiting for bed temperature to stabilize"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.BED}
    TEMPERATURE_WAIT SENSOR="heater_bed" MINIMUM={params.BED}

    RESPOND MSG="Waiting for chamber to reach temperature"
    TEMPERATURE_WAIT SENSOR="temperature_sensor toolhead" MINIMUM={CHAMBER_TARGET}

    RESPOND MSG="Homing"
    G32
    M104 S{PREHEAT_TEMP}
    PARK

    RESPOND MSG="Preheating Nozzle"
    M109 S{PREHEAT_TEMP}
    CLEAN_NOZZLE

    RESPOND MSG="AutoZ"
    BED_MESH_PROFILE LOAD=ultistik
    G28 Z
    CALIBRATE_Z
    M104 S{params.EXTRUDER}

    PARK
    M400
    RESPOND MSG="Heating Nozzle"
    M109 S{params.EXTRUDER}

    CLEAN_NOZZLE
    M400

    HOUR_COUNTER_ON
    PRIME_LINE

    RESPOND MSG="Starting Print"
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M107
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1.0 F3600                 ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    PARK
    HOUR_COUNTER_OFF
    M400                           ; wait for buffer to clear
    ## Allow some time for the nozzle to ooze out any remaining filament after retraction
    ## This is stupid, why is this thing still oozing!?
    {% for timer in range(90, 0, -1) %}
    M117 Waiting: {timer}s
    G4 P1000
    {% endfor %}
    M117 Cooling Down
    M109 S185
    CLEAN_NOZZLE
    M107
    SET_FAN_SPEED FAN=bed SPEED=0
    SET_FAN_SPEED FAN=nevermore SPEED=0
    #{% if printer["gcode_macro _ERCF_SELECT_TOOL"].color_selected|int != -1 %}
    #ERCF_EJECT
    #{% endif %}
    TURN_OFF_HEATERS
    BED_MESH_CLEAR
    CASELIGHTS_OFF
    M117 Done

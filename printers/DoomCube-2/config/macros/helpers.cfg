[gcode_macro PARK]
gcode:
    SAVE_GCODE_STATE NAME=PARK
    G90
    G1 X240 Y298.40 F10000
    RESTORE_GCODE_STATE NAME=PARK

[gcode_macro MAINTENANCE]
gcode:
    SAVE_GCODE_STATE NAME=maintenance
    G90
    G0 X150 Y20 Z80 F10000
    RESTORE_GCODE_STATE NAME=maintenance

[gcode_macro DEBUG]
gcode:
    SAVE_GCODE_STATE NAME=debug
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=240
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=110
    G90
    G28
    MAINTENANCE
    RESTORE_GCODE_STATE NAME=debug


[gcode_macro clean_nozzle]
variable_travel_speed: 10000
variable_scrub_speed: 15000
variable_brush_top: 0.5
variable_clearance_z: 5
variable_brush_left: 258.00
variable_brush_back: 298.40
variable_brush_right: 295.00
variable_brush_front: 290.5
gcode:
   SAVE_GCODE_STATE NAME=CLEAN_NOZZLE

   G90
   PARK

   G1 X{brush_left} Y{brush_front} Z{brush_top} F{travel_speed}

   {% for x in range(5) %}
   # Front Left -> Back Right
   G1 X{brush_left} Y{brush_front} F{scrub_speed}
   G1 X{brush_right} Y{brush_back} F{scrub_speed}

   # Front Right -> Back Left
   G1 X{brush_right} Y{brush_front} F{scrub_speed}
   G1 X{brush_left} Y{brush_back} F{scrub_speed}
   {% endfor %}

   G1 Z{brush_top + clearance_z} F{travel_speed}
   PARK

   RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE
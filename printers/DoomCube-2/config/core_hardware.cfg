[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 5000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1B001D000350563046353420-if00

[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_300011000843535031303420-if00

[stepper_x]
# B Motor
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA1
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 50           # Max 100
homing_retract_dist: 10.0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
# A Motor
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA2
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 50           # Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: PA0
position_max: 275
position_min: -5
homing_speed: 5.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: PD10
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PE6
dir_pin: !PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PE2
dir_pin: PE4
enable_pin: !PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z3]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PA15
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: PD5
dir_pin: PD6
enable_pin: !PD4
rotation_distance: 22.6789511	#Bondtech 5mm Drive Gears
gear_ratio: 50:17
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PB15
sensor_type: Generic 3950
sensor_pin: PC0
min_temp: 10
max_temp: 280
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_cross_section: 50
control = pid
pid_Kp=41.276
pid_Ki=1.755
pid_Kd=242.757
pressure_advance: 0.043
pressure_advance_smooth_time: 0.04

[tmc2209 extruder]
uart_pin: PD7
interpolate: false
run_current: 0.5
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
# WARNING: Do not run at full power, could warp bed
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 25.316
pid_ki: 0.662
pid_kd: 242.082

[heater_fan hotend_fan]
pin: PA13
kick_start_time: 0.5
fan_speed: 0.8
heater: extruder
heater_temp: 50.0

# Part Cooling Fan
[fan]
pin: PA14
kick_start_time: 0.5
off_below: 0.10

[bed_mesh]
speed: 300
horizontal_move_z: 10
mesh_min: 40, 40
mesh_max: 260, 260
probe_count: 7,7
zero_reference_position: 149.98, 149.98
fade_start: 0.5
fade_end: 10.0
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.10
split_delta_z: 0.01
move_check_distance: 3

[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	50,25
	50,225
	250,225
	250,25

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.00750
max_adjust: 10

[idle_timeout]
timeout: 1800 # 30 mins
gcode:
    TURN_OFF_HEATERS
    M18
    #SET_PIN PIN=caselights VALUE=0
    M117
	M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[respond]
default_type: command
